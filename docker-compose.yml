services:
  labpilot:
    image: ghcr.io/richrdj/labpilot:latest
    container_name: labpilot
    restart: unless-stopped
    env_file: .env
    ports:
      - "38471:8080"   # host-poort:containerpoort, pas de eerste aan als 38471 bezet is
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
