# LabPilot – alle koppelingen stel je in via de webinterface (Instellingen).
# Werkt met `docker compose up -d` en als Portainer-stack.
services:
  labpilot:
    image: ghcr.io/richrdj/labpilot:latest
    container_name: labpilot
    restart: unless-stopped
    ports:
      - "38471:8080"   # host-poort:containerpoort – pas 38471 aan als die bezet is
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - labpilot-data:/data   # instellingen (incl. wachtwoorden) blijven bewaard
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  labpilot-data:
