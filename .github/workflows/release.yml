name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release bundle
        run: |
          mkdir -p dist/labpilot
          sed "s#ghcr.io/richrdj/labpilot:latest#ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.image.outputs.version }}#" docker-compose.yml > dist/labpilot/docker-compose.yml
          cp .env.example README.md LICENSE dist/labpilot/
          (cd dist && zip -r "labpilot-${GITHUB_REF_NAME}.zip" labpilot)

      - name: Write release notes
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.image.outputs.version }}"
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Installeren"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}"
            echo '```'
            echo
            echo "Of download **labpilot-${GITHUB_REF_NAME}.zip** hieronder: daar zitten \`docker-compose.yml\` en \`.env.example\` in."
            echo
            echo "## Wijzigingen"
            echo
            if [ -n "$PREV" ]; then
              git log --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}" --no-merges
            else
              git log --pretty='- %s' --no-merges
            fi
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # release was created in the web UI: add assets and notes to it
            gh release edit "${GITHUB_REF_NAME}" --title "LabPilot ${GITHUB_REF_NAME}" --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" "dist/labpilot-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "LabPilot ${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              "dist/labpilot-${GITHUB_REF_NAME}.zip"
          fi
