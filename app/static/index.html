<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LabPilot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css?v={{VERSION}}" />
  <script>try{const t=localStorage.getItem('lp-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg></div>
        <div><div class="brand-name">LabPilot</div><div class="brand-sub">Homelab control center</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sources"></div>
    </aside>
    <main>
      <div class="topbar">
        <div>
          <h1 id="page-title">Overzicht</h1>
          <div class="sub" id="page-sub">&nbsp;</div>
        </div>
        <div class="spacer"></div>
        <button class="btn search-btn" id="open-palette"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Zoek of voer een actie uit<span class="kbd">Ctrl K</span></button>
        <span class="pill" id="health-pill"><span class="live"></span>Verbinden…</span>
        <button class="btn icon" id="refresh" title="Nu verversen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="btn icon" id="theme" title="Thema wisselen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="overlay" id="palette-overlay">
    <div class="palette">
      <input id="palette-input" placeholder="Zoek een VM, apparaat, job of pagina…" autocomplete="off" />
      <div class="results" id="palette-results"></div>
      <div class="foot"><span><span class="kbd">↑↓</span> navigeren</span><span><span class="kbd">Enter</span> uitvoeren</span><span><span class="kbd">Esc</span> sluiten</span></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
