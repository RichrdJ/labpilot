<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LabPilot · Inloggen</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; position: relative; z-index: 1; }
    .login .card { width: min(380px, 90vw); padding: 32px; text-align: center; }
    .login .brand-logo { width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 18px; }
    .login h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.02em; }
    .login p { color: var(--text-3); margin: 0 0 24px; font-size: 13px; }
    .login .input { width: 100%; height: 42px; margin-bottom: 12px; font-size: 14px; }
    .login .btn { width: 100%; height: 42px; justify-content: center; }
    .err { color: var(--crit); font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="login">
    <form class="card" method="post" action="/login">
      <div class="brand-logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg></div>
      <h1>Welkom terug</h1>
      <p>Log in op je LabPilot-dashboard</p>
      <div class="err" id="err">Onjuist wachtwoord. Probeer het opnieuw.</div>
      <input class="input" type="password" name="password" placeholder="Wachtwoord" autofocus required />
      <button class="btn primary" type="submit">Inloggen</button>
    </form>
  </div>
  <script>if (location.search.includes('error')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
